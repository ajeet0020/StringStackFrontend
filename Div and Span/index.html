<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span</title>
</head>
<body>

    <!-- header -->
    <div>
        <h1>My WebSite</h1>
    </div>
<!-- Nav Bar -->
    <div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </div>
<!-- Paragraph -->
    <div>
    <h2> Section One </h2>
        <p>This is first Paragraph in the <span>section one</span></p>
        <p>This is Second Paragraph in the section one</p>
   

        
    <h2> Section Two </h2>
        <p>This is first Paragraph in the section two</p>
        <p>This is Second Paragraph in the section two</p>
    </div>
<!-- Footer -->
    <div>
        &copy; 2023 My WebSite. All rights reserved.
    </div>


</body>
</html>
