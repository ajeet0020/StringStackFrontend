<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Buttons and Check Boxes</title>
</head>
<body>
    <h1>Radio and checkbox</h1>

    <!-- CheckBoxes -->`
     <form>
        <div>
            <label for="Masala Dosa"></label>
            <input type="checkbox" name="Dishes" id="Masala Dosa" value="Masala Dosa" checked> Masala Dosa
        </div>
        
        <div>
            <label for="Pani Poori" ></label>
            <input type="checkbox" name="Dishes" id="Pani Poori" value="Pani Poori" disabled > Pani Poori
        </div>
        
     </form>

     <!-- Radio Button -->

        <h2>Product Size</h2>
        <form>
            <label for="small">
            <input type="radio" name="size" id="small">small
            </label>

            <label for="medium">
            <input type="radio" name="size" id="medium">medium
            </label>

            <label for="large">
            <input type="radio" name="size" id="large">large
            </label>


        </form>
</body>
</html>
