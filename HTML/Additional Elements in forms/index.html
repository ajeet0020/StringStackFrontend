<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other form element</title>
</head>
<body>
    
    <h1>Other Types of elements </h1>
    <form>
        <!-- color -->
         <label for="color">Color
         <input type="color" name="color" id="color">
         </label>

         <br>
         <br>
        <label for="date">Date
            <input type="datetime-local" name="date" id="date">
        </label>

        <!-- Range -->

        <br>
        <br>
         <label for="range">Range</label>
         <input type="range" name="range" id="range" min="0" max="80" step="10">


    </form>
</body>
</html>
