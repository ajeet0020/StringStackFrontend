<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes and ID's </title>
</head>
<body>

    <!-- header -->
    <div id="header">
        <h1>My WebSite</h1>
    </div>
<!-- Nav Bar -->
    <div id="links">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </div>
<!-- Paragraph -->
    <div class="section text-center">
    <h2 class="text-large"> Section One </h2>
        <p>This is first Paragraph in the <span>section one</span></p>
        <p>This is Second Paragraph in the section one</p>
   

        
    <h2 class="text- extra Large"> Section Two </h2>
        <p>This is first Paragraph in the section two</p>
        <p>This is Second Paragraph in the section two</p>
    </div>
<!-- Footer -->
    <div id="Footer">
        &copy; 2023 My WebSite. All rights reserved.
    </div>


</body>
</html>
