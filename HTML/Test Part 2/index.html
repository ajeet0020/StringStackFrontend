<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS SandBox</title>
</head>
<body>
    <details open>
    <summary>Click For Solution</summary>

    <h1>Apartment Search</h1>

    <form>
        <label for="location">Location</label>
        <input type="text" placeholder="Enter Location" name="location" id="location">

        <br>
        <br>
        <label for="range">Price</label>
        <input type="Range" name="range" id="range">

        <br>
        <br>
        <label for="bed">Bedrooms</label>
        <input type="number" placeholder="Enter Number" name="bed" id="bed">

        <br>
        <br>
        <label for="bath">Bathrooms</label>
        <input type="number" placeholder="Enter Number" name="bath" id="bath">

        <br>
       <br>
        <label for="pets">Pets Allowed</label>
        <input type="checkbox" name="pets" id="pets">

        <br>
        <br>
        <label for="date">Date Available</label>
        <input type="date" name="date" id="date">

        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
   
    </details>
</body>
</html>
